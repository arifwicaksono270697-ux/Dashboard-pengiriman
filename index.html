$('#dt').onchange=e=>{if(e.target.value){S.t=hi(e.target.value);if(S.f>S.t)S.f=S.t;render()}};
$('#th').onclick=()=>{const r=document.documentElement,dk=css('--bg')=='#0a0f21';r.dataset.theme=dk?'light':'dark';render()};

const ORD=['RACK TO FNS','PRT TO FNS','RETUR EX PRINTING','FNS TO PRT','FNS TO GAS','FNS TO QA REG','FNS TO QA EXP'];
function iso(v){if(v==null||v==='')return null;let d;if(typeof v=='number')d=new Date(Math.round((v-25569)*864e5));else if(v instanceof Date)d=v;else{const m=String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);d=m?new Date(Date.UTC(+m[3],m[2]-1,+m[1])):new Date(v)}return isNaN(d)?null:d.toISOString().slice(0,10)}
function parseWB(wb){const out=[];
wb.SheetNames.forEach(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});if(rows.length<2)return;
const h=rows[0].map(x=>String(x==null?'':x).trim().toLowerCase()),ik=h.indexOf('kode_prod');if(ik<0)return;
let iq=h.indexOf('qty');if(iq<0)iq=h.indexOf('saldo_awal');if(iq<0)return;let it=h.indexOf('tgl');if(it<0)it=iq+1;const ib=h.indexOf('brand'),iv=h.indexOf('variant'),m=new Map();
rows.slice(1).forEach(r=>{const k=r[ik],dt=iso(r[it]);if(k==null||k===''||!dt)return;const b=String(r[ib]??'-').trim()||'-',v=String(r[iv]??'-').trim()||'-',kk=String(k).trim(),key=dt+'|'+kk+'|'+b+'|'+v;let o=m.get(key);if(!o)m.set(key,o=[dt,kk,b,v,0,0]);o[4]+=+r[iq]||0;o[5]++});
if(m.size)out.push({n:n.trim().toUpperCase(),m})});
out.sort((a,b)=>{const x=ORD.indexOf(a.n),y=ORD.indexOf(b.n);return(x<0?99:x)-(y<0?99:y)});
const dates=[...new Set(out.flatMap(o=>[...o.m.values()].map(r=>r[0])))].sort();
return{dates,sheets:out.map(o=>({n:o.n,r:[...o.m.values()].map(r=>[dates.indexOf(r[0]),r[1],r[2],r[3],r[4],r[5]])}))}}
function apply(d,name,saved){D=d;SH=D.sheets;SHIP=SHIP0.filter(n=>sidx(n)>=0);
Object.values(CH).forEach(c=>c.destroy());CH={};M=null;cm();
S.f=0;S.t=D.dates.length-1;S.q='';$('#q').value='';S.sd=new Set();S.cum=new Set(SHIP);if(!['ov','cum','sum'].includes(S.tab)&&sidx(S.tab)<0)S.tab='ov';
$('#df').min=$('#dt').min=D.dates[0];$('#df').max=$('#dt').max=D.dates[S.t];
$('#src').textContent=name;const nr=SH.reduce((a,s)=>a+s.r.reduce((b,x)=>b+x[5],0),0);
$('#st').textContent='✅ '+SH.length+' sheet · '+fm(nr)+' baris data · '+D.dates.length+' tanggal'+(SHIP.length<3?' · ⚠ sheet pengiriman tidak lengkap':'');
$('#rs').style.display=D===ORIG?'none':'';render()}
async function load(f){if(!f)return;const st=$('#st');try{if(typeof XLSX=='undefined')throw new Error('library Excel belum termuat (cek internet)');
st.textContent='⏳ Membaca '+f.name+'…';const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),d=parseWB(wb);
if(!d.sheets.length||!d.dates.length){st.textContent='⚠ Tidak ada sheet yang berisi kolom kode_prod, qty/saldo_awal, dan tgl.';return}
apply(d,f.name.replace(/\.[^.]+$/,''));try{localStorage.setItem('fnsD',JSON.stringify({d,name:f.name.replace(/\.[^.]+$/,'')}))}catch(e){}}
catch(e){st.textContent='⚠ Gagal membaca file: '+e.message}}
$('#fi').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('#rs').onclick=()=>{try{localStorage.removeItem('fnsD')}catch(e){}apply(ORIG,'UP DATE MUTASI KAIN FNS OKTOBER 2026')};
['dragenter','dragover'].forEach(v=>document.addEventListener(v,e=>{e.preventDefault();document.body.classList.add('dz')}));
['dragleave','drop'].forEach(v=>document.addEventListener(v,e=>{e.preventDefault();document.body.classList.remove('dz');if(v=='drop')load(e.dataTransfer.files[0])}));
try{const sv=JSON.parse(localStorage.getItem('fnsD')||'null');if(sv&&sv.d&&sv.d.sheets&&sv.d.dates)apply(sv.d,sv.name)}catch(e){}
render();
</script></body></html>
